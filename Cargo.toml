[package]
name = "raksa-hostguard"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Defensive host integrity monitor and Linux/Docker CIS configuration auditor"
repository = "https://github.com/luminariadev/raksa-hostguard"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "fim_throughput"
harness = false
