# Intentionally weak SSH crypto and forwarding policy fixture (HOST-105, HOST-106)
Port 22
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
X11Forwarding no
Ciphers aes128-cbc,3des-cbc,aes256-gcm@openssh.com
MACs hmac-md5,hmac-sha1,hmac-sha2-256
KexAlgorithms diffie-hellman-group1-sha1,curve25519-sha256
AllowAgentForwarding yes
AllowTcpForwarding yes
PermitUserEnvironment yes
ClientAliveInterval 900
