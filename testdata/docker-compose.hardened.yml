# Hardened docker-compose definition using pinned tags and interpolation
services:
  web:
    image: nginx:1.27.4-alpine
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: production
      API_TOKEN: ${API_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD}
